
<!DOCTYPE html>
<html lang="my">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#10264a">
  <title>PTY-TECH | Admin Dashboard</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f1f5f9;
      color: #172033;
    }

    header {
      background: #10264a;
      color: white;
      padding: 20px;
    }

    header h2 { margin: 0 0 5px; }

    main {
      max-width: 1100px;
      margin: 24px auto;
      padding: 0 16px;
    }

    .card {
      background: white;
      padding: 22px;
      border-radius: 14px;
      margin-bottom: 20px;
      box-shadow: 0 3px 15px #0000000b;
    }

    h3 { margin-top: 0; }

    input, textarea, button {
      font: inherit;
      padding: 12px;
      border-radius: 8px;
    }

    input, textarea {
      width: 100%;
      border: 1px solid #cbd5e1;
      margin: 6px 0 14px;
      background: white;
      color: #172033;
    }

    button {
      border: 0;
      background: #155eef;
      color: white;
      cursor: pointer;
    }

    button:disabled {
      opacity: .6;
      cursor: wait;
    }

    .secondary { background: #475569; }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }

    .hidden { display: none !important; }

    #message {
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      margin: 12px 0;
    }

    .table-wrap { overflow-x: auto; }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 650px;
    }

    th, td {
      text-align: left;
      padding: 10px;
      border-bottom: 1px solid #e2e8f0;
    }

    th { background: #f8fafc; }

    .muted {
      color: #64748b;
      font-size: 13px;
    }

    .status-select {
      min-width: 165px;
      padding: 8px;
      border: 1px solid #cbd5e1;
      border-radius: 7px;
      background: #fff;
      color: #172033;
      margin: 0 0 6px;
      font: inherit;
    }

    .status-save {
      display: block;
      padding: 8px 10px;
      font-size: 13px;
      white-space: nowrap;
    }

    @media (max-width: 650px) {
      .grid { grid-template-columns: 1fr; }
      .card { padding: 16px; }
    }
  </style>
</head>

<body>
  <header>
    <h2>PTY-TECH</h2>
    <div>Repair Management System</div>
  </header>

  <main>
    <div id="message" role="status" aria-live="polite"></div>

    <section id="login" class="card">
      <h3>Admin Login</h3>

      <form id="loginForm">
        <label for="email">Email</label>
        <input
          id="email"
          type="email"
          required
          autocomplete="username"
        >

        <label for="password">Password</label>
        <input
          id="password"
          type="password"
          required
          autocomplete="current-password"
        >

        <button type="submit">Login ဝင်မည်</button>
      </form>
    </section>

    <section id="dashboard" class="hidden">
      <div class="card">
        <h3>Admin Dashboard</h3>
        <p>PTY-TECH Repair Job Management</p>
        <button id="logout" class="secondary" type="button">
          Logout
        </button>
      </div>

      <div class="card">
        <h3>Repair Job အသစ်ထည့်ရန်</h3>

        <form id="jobForm">
          <div class="grid">
            <div>
              <label for="customer_name">Customer အမည် *</label>
              <input
                id="customer_name"
                name="customer_name"
                required
              >
            </div>

            <div>
              <label for="customer_phone">ဖုန်းနံပါတ် *</label>
              <input
                id="customer_phone"
                name="customer_phone"
                type="tel"
                required
              >
            </div>

            <div>
              <label for="device_type">စက်အမျိုးအစား *</label>
              <input
                id="device_type"
                name="device_type"
                required
                placeholder="ဥပမာ - Welding Machine"
              >
            </div>

            <div>
              <label for="brand_model">Brand / Model</label>
              <input
                id="brand_model"
                name="brand_model"
                placeholder="Brand / Model"
              >
            </div>

            <div>
              <label for="estimated_cost">
                ခန့်မှန်းကုန်ကျစရိတ် (MMK)
              </label>
              <input
                id="estimated_cost"
                name="estimated_cost"
                type="number"
                min="0"
                step="0.01"
                value="0"
                required
              >
            </div>
            <div>
              <label for="estimated_completion_date">ခန့်မှန်းပြီးစီးမည့်ရက်</label>
              <input id="estimated_completion_date" name="estimated_completion_date" type="date">
            </div>
          </div>

          <label for="problem_description">
            စက်ချို့ယွင်းချက် *
          </label>
          <textarea
            id="problem_description"
            name="problem_description"
            required
            rows="3"
          ></textarea>

          <button type="submit">Repair Job သိမ်းမည်</button>
        </form>
      </div>

      <div class="card">
        <h3>Repair Job စာရင်း</h3>

        <button
          id="refresh"
          class="secondary"
          type="button"
        >
          စာရင်းပြန်ဖတ်မည်
        </button>

        <p id="jobCount" class="muted"></p>

        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Job No.</th>
                <th>Customer</th>
                <th>စက်အမျိုးအစား</th>
                <th>Status</th>
                <th>ခန့်မှန်းကုန်ကျစရိတ်</th>
                <th>လက်ခံရက်</th>
                <th>ခန့်မှန်းပြီးစီးရက်</th>
                <th>Status ပြောင်းရန်</th>
                <th>Tracking Code</th>
                <th>SMS ပို့ရန်</th>
              </tr>
            </thead>
            <tbody id="jobs"></tbody>
          </table>
        </div>
      </div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    "use strict";

    // Supabase Project Settings မှ ရရှိသော အချက်အလက်များ
    const SUPABASE_URL =
      "https://pcwpfuyvldbojyndlwld.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_mQnOAsZYrv2-5S9vicuotw_6inO7g8Q";

    const message = document.getElementById("message");
    const loginSection = document.getElementById("login");
    const dashboard = document.getElementById("dashboard");
    const jobsBody = document.getElementById("jobs");
    const jobCount = document.getElementById("jobCount");

    let db = null;
    let currentUserId = null;
    let authSubscription = null;

    function showMessage(text, error = false) {
      message.textContent = text;
      message.style.color = error ? "#b91c1c" : "#166534";
    }

    function showDashboard(signedIn) {
      loginSection.classList.toggle("hidden", signedIn);
      dashboard.classList.toggle("hidden", !signedIn);
    }

    function formatMMK(value) {
      const amount = Number(value);
      if (value == null || value === "" || !Number.isFinite(amount)) return "—";
      return new Intl.NumberFormat("en-US", { maximumFractionDigits: 0 }).format(amount) + " MMK";
    }

    function formatDate(value) {
      if (!value) return "—";
      const date = new Date(value);
      if (Number.isNaN(date.getTime())) return "—";
      return date.toLocaleDateString("en-GB", { year: "numeric", month: "2-digit", day: "2-digit" });
    }

    function setButtonBusy(button, busy, busyText) {
      if (busy) {
        button.dataset.originalText = button.textContent;
        button.textContent = busyText;
        button.disabled = true;
      } else {
        button.textContent =
          button.dataset.originalText || button.textContent;
        button.disabled = false;
      }
    }

    async function checkAdmin() {
      const {
        data: { user },
        error: userError
      } = await db.auth.getUser();

      if (userError) throw userError;

      if (!user) {
        currentUserId = null;
        showDashboard(false);
        return false;
      }

      const { data, error } = await db
        .from("admin_users")
        .select("user_id")
        .eq("user_id", user.id)
        .maybeSingle();

      if (error) {
        throw new Error(
          "Admin Role စစ်ဆေးမရပါ။ admin_users Policy ကိုစစ်ပါ။ " +
          error.message
        );
      }

      if (!data) {
        await db.auth.signOut();
        currentUserId = null;
        showDashboard(false);

        throw new Error(
          "ဒီ Account ကို Admin အဖြစ် ခွင့်ပြုထားခြင်းမရှိပါ။ " +
          "admin_users ထဲရှိ user_id ကိုစစ်ပါ။"
        );
      }

      currentUserId = user.id;
      showDashboard(true);
      await loadJobs();

      return true;
    }

    async function loadJobs() {
      if (!db || !currentUserId) return;

      jobsBody.replaceChildren();
      jobCount.textContent = "စာရင်းဖတ်နေသည်...";

      const { data, error } = await db
        .from("repair_jobs")
        .select(
          "job_no, customer_name, customer_phone, device_type, status, tracking_code, estimated_cost, received_at, estimated_completion_date"
        )
        .order("received_at", { ascending: false })
        .limit(100);

      if (error) {
        jobCount.textContent = "";
        showMessage(
          "Repair Job စာရင်းဖတ်မရပါ: " + error.message,
          true
        );
        return;
      }

      const rows = data || [];

      for (const job of rows) {
        const tr = document.createElement("tr");

        for (const value of [
          job.job_no,
          job.customer_name,
          job.device_type,
          job.status,
          formatMMK(job.estimated_cost),
          formatDate(job.received_at),
          formatDate(job.estimated_completion_date)
        ]) {
          const td = document.createElement("td");
          td.textContent = value == null ? "" : String(value);
          tr.appendChild(td);
        }

        const actionCell = document.createElement("td");
        const statusSelect = document.createElement("select");
        statusSelect.className = "status-select";
        statusSelect.setAttribute("aria-label", "Job No. " + job.job_no + " Status");

        const statusOptions = [
          ["received", "လက်ခံရရှိ"],
          ["diagnosing", "စစ်ဆေးနေဆဲ"],
          ["in_progress", "ပြုပြင်နေဆဲ"],
          ["waiting_parts", "ပစ္စည်းစောင့်ဆိုင်းနေ"],
          ["completed", "ပြုပြင်ပြီး"],
          ["ready_for_pickup", "လာရောက်ယူနိုင်ပါပြီ"],
          ["delivered", "အပ်နှံပြီး"],
          ["cancelled", "ပယ်ဖျက်ထား"]
        ];

        for (const [value, label] of statusOptions) {
          const option = document.createElement("option");
          option.value = value;
          option.textContent = label;
          if (value === job.status) option.selected = true;
          statusSelect.appendChild(option);
        }

        // Database ထဲတွင် ရှိနေသော status အသစ်/မသိသော value ကို မပျောက်စေရန်
        if (job.status && !statusOptions.some(([value]) => value === job.status)) {
          const currentOption = document.createElement("option");
          currentOption.value = job.status;
          currentOption.textContent = String(job.status) + " (လက်ရှိ)";
          currentOption.selected = true;
          statusSelect.appendChild(currentOption);
        }

        const saveButton = document.createElement("button");
        saveButton.type = "button";
        saveButton.className = "status-save";
        saveButton.textContent = "Status သိမ်းမည်";
        saveButton.addEventListener("click", async () => {
          if (!db || !currentUserId) {
            showMessage("Admin Login ပြန်ဝင်ပါ။", true);
            return;
          }

          const newStatus = statusSelect.value;
          if (newStatus === job.status) {
            showMessage("Job No. " + job.job_no + " ၏ Status မပြောင်းထားပါ။");
            return;
          }

          setButtonBusy(saveButton, true, "သိမ်းနေသည်...");
          try {
            const { data: updatedRows, error } = await db
              .from("repair_jobs")
              .update({ status: newStatus })
              .eq("job_no", job.job_no)
              .select("job_no, status");

            if (error) {
              throw new Error(
                "Database Update မအောင်မြင်ပါ။ Supabase RLS UPDATE Policy ကိုစစ်ပါ။ " +
                error.message
              );
            }

            if (!updatedRows || updatedRows.length === 0) {
              throw new Error(
                "ပြောင်းလဲထားသော Row မပြန်လာပါ။ repair_jobs အတွက် UPDATE Policy နှင့် job_no ကို စစ်ပါ။"
              );
            }

            showMessage(
              "Job No. " + job.job_no + " Status ကို " +
              newStatus + " သို့ ပြောင်းပြီးပါပြီ။ Customer Tracking မှာ ပြန်စစ်ပါ။"
            );
            await loadJobs();

          } catch (error) {
            showMessage("Status ပြောင်းမရပါ: " + error.message, true);
          } finally {
            setButtonBusy(saveButton, false);
          }
        });

        actionCell.appendChild(statusSelect);
        actionCell.appendChild(saveButton);
        tr.appendChild(actionCell);

        const trackingCell = document.createElement("td");
        trackingCell.textContent = job.tracking_code == null ? "" : String(job.tracking_code);
        tr.appendChild(trackingCell);

        const smsCell = document.createElement("td");
        const smsButton = document.createElement("button");
        smsButton.type = "button";
        smsButton.className = "status-save";
        smsButton.textContent = "SMS App ဖွင့်ရန်";
        smsButton.addEventListener("click", () => {
          const phone = String(job.customer_phone || "").trim();
          if (!phone) {
            showMessage("ဒီ Customer အတွက် ဖုန်းနံပါတ် မရှိပါ။", true);
            return;
          }
          if (!job.tracking_code) {
            showMessage("Tracking Code မရှိသေးသောကြောင့် SMS မပြင်ဆင်နိုင်ပါ။", true);
            return;
          }

          const trackingUrl = "https://phyothuyabusiness-mm.github.io/tech/tracking.html";
          const statusLabels = {
            received: "လက်ခံရရှိ",
            diagnosing: "စစ်ဆေးနေဆဲ",
            in_progress: "ပြုပြင်နေဆဲ",
            waiting_parts: "ပစ္စည်းစောင့်ဆိုင်းနေ",
            completed: "ပြုပြင်ပြီး",
            ready_for_pickup: "လာရောက်ယူနိုင်ပါပြီ",
            delivered: "အပ်နှံပြီး",
            cancelled: "ပယ်ဖျက်ထား"
          };
          const statusText = statusLabels[job.status] || job.status || "လက်ခံရရှိ";
          const smsBody =
            "မင်္ဂလာပါ။ PTY-TECH တွင် သင့်စက်ကို ပြုပြင်ရန် လက်ခံရရှိပါပြီ။\n" +
            "Job No: " + job.job_no + "\n" +
            "Tracking Code: " + job.tracking_code + "\n" +
            "အခြေအနေ: " + statusText + "\n" +
            "ပြုပြင်မှုအခြေအနေ စစ်ဆေးရန်: " + trackingUrl + "\n" +
            "Tracking စာမျက်နှာတွင် Tracking Code ကို ထည့်သွင်းစစ်ဆေးနိုင်ပါသည်။\n" +
            "PTY-TECH ကို ယုံကြည်စွာ အသုံးပြုသည့်အတွက် ကျေးဇူးတင်ပါသည်။";

          const smsNumber = phone.replace(/[^0-9+]/g, "");
          const smsUri = "sms:" + smsNumber + "?body=" + encodeURIComponent(smsBody);
          showMessage("SMS App ကိုဖွင့်နေသည်။ စာသားနှင့် ဖုန်းနံပါတ်ကို စစ်ဆေးပြီး SMS App ထဲမှ Send ကိုနှိပ်ပါ။");
          window.location.href = smsUri;
        });

        smsCell.appendChild(smsButton);
        tr.appendChild(smsCell);

        jobsBody.appendChild(tr);
      }

      jobCount.textContent =
        "ပြသထားသော Repair Job စုစုပေါင်း: " + rows.length;
    }

    document
      .getElementById("loginForm")
      .addEventListener("submit", async (event) => {
        event.preventDefault();

        if (!db) {
          showMessage("Supabase ချိတ်ဆက်မှု မပြည့်စုံပါ။", true);
          return;
        }

        const form = event.currentTarget;
        const button = form.querySelector('button[type="submit"]');

        setButtonBusy(button, true, "Login စစ်ဆေးနေသည်...");
        showMessage("Account စစ်ဆေးနေသည်...");

        try {
          const email =
            document.getElementById("email").value.trim();

          const password =
            document.getElementById("password").value;

          const { error } = await db.auth.signInWithPassword({
            email,
            password
          });

          if (error) throw error;

          await checkAdmin();
          showMessage("Login အောင်မြင်ပါပြီ။");

        } catch (error) {
          showMessage(
            "Login မအောင်မြင်ပါ: " + error.message,
            true
          );
        } finally {
          setButtonBusy(button, false);
        }
      });

    document
      .getElementById("jobForm")
      .addEventListener("submit", async (event) => {
        event.preventDefault();

        if (!db || !currentUserId) {
          showMessage("Admin Login ပြန်ဝင်ပါ။", true);
          showDashboard(false);
          return;
        }

        const form = event.currentTarget;
        const button = form.querySelector('button[type="submit"]');

        setButtonBusy(button, true, "သိမ်းဆည်းနေသည်...");

        try {
          const values =
            Object.fromEntries(new FormData(form).entries());

          const estimatedCost = Number(values.estimated_cost);

          if (
            !Number.isFinite(estimatedCost) ||
            estimatedCost < 0
          ) {
            throw new Error("ကုန်ကျစရိတ်ကို မှန်ကန်စွာ ထည့်ပါ။");
          }

          const { data, error } = await db
            .from("repair_jobs")
            .insert({
              customer_name: values.customer_name.trim(),
              customer_phone: values.customer_phone.trim(),
              device_type: values.device_type.trim(),
              brand_model: values.brand_model.trim() || null,
              problem_description:
                values.problem_description.trim(),
              estimated_cost: estimatedCost,
              estimated_completion_date: values.estimated_completion_date || null
            })
            .select("job_no, tracking_code")
            .single();

          if (error) throw error;

          showMessage(
            "Repair Job သိမ်းပြီးပါပြီ။\n" +
            "Job No: " + (data.job_no ?? "") + "\n" +
            "Tracking Code: " + (data.tracking_code ?? "")
          );

          form.reset();
          await loadJobs();

        } catch (error) {
          showMessage(
            "Repair Job သိမ်းမရပါ: " + error.message,
            true
          );
        } finally {
          setButtonBusy(button, false);
        }
      });

    document
      .getElementById("refresh")
      .addEventListener("click", async () => {
        try {
          await loadJobs();
        } catch (error) {
          showMessage("စာရင်းဖတ်မရပါ: " + error.message, true);
        }
      });

    document
      .getElementById("logout")
      .addEventListener("click", async () => {
        if (!db) return;

        try {
          const { error } = await db.auth.signOut();

          if (error) throw error;

          currentUserId = null;
          showDashboard(false);
          showMessage("Logout အောင်မြင်ပါပြီ။");

        } catch (error) {
          showMessage(
            "Logout မအောင်မြင်ပါ: " + error.message,
            true
          );
        }
      });

    async function start() {
      try {
        if (
          !SUPABASE_URL.startsWith("https://") ||
          SUPABASE_URL.includes("YOUR_SUPABASE") ||
          SUPABASE_KEY.includes("YOUR_SUPABASE")
        ) {
          throw new Error(
            "Supabase URL နဲ့ Publishable Key ကိုစစ်ပါ။"
          );
        }

        if (!window.supabase) {
          throw new Error(
            "Supabase Library မဖွင့်နိုင်ပါ။ Internet ချိတ်ဆက်မှုကို စစ်ပါ။"
          );
        }

        db = window.supabase.createClient(
          SUPABASE_URL,
          SUPABASE_KEY
        );

        const {
          data: { session },
          error
        } = await db.auth.getSession();

        if (error) throw error;

        if (session) {
          await checkAdmin();
        } else {
          showDashboard(false);
        }

        const { data } = db.auth.onAuthStateChange(
          (event, session) => {
            if (event === "SIGNED_OUT" || !session) {
              currentUserId = null;
              showDashboard(false);
              jobsBody.replaceChildren();
            }
          }
        );

        authSubscription = data.subscription;

      } catch (error) {
        showDashboard(false);
        showMessage(
          "စတင်ဖွင့်ရာတွင် Error ဖြစ်နေသည်: " + error.message,
          true
        );
      }
    }

    window.addEventListener("beforeunload", () => {
      if (authSubscription) {
        authSubscription.unsubscribe();
      }
    });

    start();
  </script>
</body>
</html>
