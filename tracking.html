<!DOCTYPE html>
<html lang="my">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#07152e">
  <title>PTY-TECH | Repair Tracking</title>

  <style>
    :root { color-scheme: light; --navy:#07152e; --blue:#1763d1; --gold:#e6b85c; --ink:#15233b; --muted:#6c7b91; --line:#e5ebf4; }
    * { box-sizing:border-box; }
    body {
      margin:0; min-height:100vh; padding:28px 16px; display:flex; align-items:center; justify-content:center;
      font-family:Arial,"Myanmar Text","Noto Sans Myanmar",sans-serif; color:var(--ink);
      background:radial-gradient(ellipse at 12% 8%,#1d5b9d88 0,transparent 34%),radial-gradient(ellipse at 92% 92%,#b8883d44 0,transparent 30%),linear-gradient(145deg,#061126 0%,#0b2346 54%,#123e68 100%);
      position:relative; isolation:isolate;
    }
    body::before,body::after { content:"";position:fixed;z-index:-1;border:1px solid #ffffff12;border-radius:50%;pointer-events:none; }
    body::before { width:420px;height:420px;top:-210px;right:-100px; } body::after { width:300px;height:300px;bottom:-160px;left:-100px; }
    .card { width:100%;max-width:540px;padding:clamp(22px,5vw,38px);background:rgba(255,255,255,.97);border:1px solid #ffffffa6;border-radius:28px;box-shadow:0 28px 85px #0005,0 2px 8px #0001;backdrop-filter:blur(16px);animation:rise-in .55s ease both; }
    @keyframes rise-in { from { opacity:0;transform:translateY(12px); } to { opacity:1;transform:translateY(0); } }
    .brand { text-align:center;margin-bottom:28px; }
    .logo { width:68px;height:68px;margin:0 auto;border-radius:21px;background:linear-gradient(145deg,#164b83,#071a36);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:21px;letter-spacing:1px;box-shadow:0 10px 24px #0d2c5433,inset 0 1px 0 #ffffff38;position:relative; }
    .logo::after { content:"";position:absolute;width:12px;height:4px;border-radius:5px;background:var(--gold);bottom:10px; }
    .brand::before { content:"PTY-TECH  •  CUSTOMER PORTAL";display:block;margin-bottom:14px;color:#9a762f;font-size:10px;font-weight:800;letter-spacing:2px; }
    h1 { font-size:clamp(23px,5vw,28px);margin:16px 0 8px;color:#0b2446;letter-spacing:-.5px; }
    .sub { color:var(--muted);font-size:14px;line-height:1.9;margin:0 auto;max-width:350px; }
    form { padding:20px;border-radius:19px;background:linear-gradient(145deg,#f7faff,#f0f5fc);border:1px solid #e7edf7; }
    label { display:block;font-weight:800;font-size:13px;margin:0 0 9px;color:#243754; }
    input { width:100%;padding:15px 16px;border:1px solid #d4deeb;border-radius:12px;background:#fff;color:var(--ink);font-size:16px;outline:none;transition:border-color .2s,box-shadow .2s,background .2s; }
    input::placeholder { color:#9aa7b9; } input:focus { border-color:#347de0;box-shadow:0 0 0 4px #347de01b;background:#fff; }
    button { width:100%;margin-top:12px;border:0;border-radius:12px;padding:15px 16px;background:linear-gradient(100deg,#1763d1,#104a9f);color:#fff;font-size:15px;font-weight:800;cursor:pointer;box-shadow:0 8px 18px #1763d12c;transition:transform .18s,box-shadow .18s,filter .18s; }
    button:hover { filter:brightness(1.06);box-shadow:0 11px 24px #1763d13b;transform:translateY(-1px); } button:active { transform:translateY(0); } button:disabled { opacity:.68;cursor:wait;transform:none; }
    #message { margin-top:15px;font-size:13px;line-height:1.8;overflow-wrap:anywhere; }
    .result { margin-top:20px;border:1px solid var(--line);border-radius:18px;overflow:hidden;background:#fff;box-shadow:0 8px 24px #0b244608; }
    .result h2 { margin:0;padding:17px 18px;background:linear-gradient(110deg,#edf4ff,#f8faff);border-bottom:1px solid var(--line);font-size:16px;color:#102f57; }
    .item { display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 18px;border-top:1px solid #edf1f6; } .item:first-of-type { border-top:0; }
    .key { color:var(--muted);font-size:13px;flex-shrink:0; } .value { font-weight:750;font-size:14px;text-align:right;overflow-wrap:anywhere; }
    .status { display:inline-block;border-radius:99px;background:#e6f7ed;color:#14733d;padding:7px 12px;font-size:12px;font-weight:800;border:1px solid #c8ecd5; }
    .tracking-code-row { align-items:center; }
    .tracking-code-actions { display:flex;align-items:center;justify-content:flex-end;gap:8px;min-width:0; }
    .tracking-code-text { font-weight:850;font-size:14px;letter-spacing:.5px;overflow-wrap:anywhere; }
    .copy-btn { width:auto;margin:0;padding:9px 12px;border-radius:9px;font-size:12px;white-space:nowrap;box-shadow:none;background:linear-gradient(100deg,#0c8152,#096641); }
    .copy-btn:hover { box-shadow:0 5px 12px #09664126; }
    .foot { text-align:center;color:#8793a5;font-size:11px;margin:24px 0 0;letter-spacing:.2px; } .hidden { display:none !important; }
    @media (max-width:420px) { body { padding:14px 10px;align-items:flex-start; } .card { padding:22px 17px;border-radius:22px;margin:10px 0; } form { padding:16px; } .item { gap:12px;padding:13px 14px; } .key,.value { font-size:12px; } .result h2 { padding:15px 14px; } }
    @media (prefers-reduced-motion:reduce) { *,*::before,*::after { animation-duration:.01ms !important;transition-duration:.01ms !important; } }
  </style>
</head>

<body>
  <main class="card">

    <header class="brand">
      <div class="logo">PTY</div>
      <h1>Repair Job Tracking</h1>
      <p class="sub">
        ပြုပြင်ရေးအလုပ်အခြေအနေကို Tracking Code ဖြင့်
        စစ်ဆေးနိုင်ပါသည်။
      </p>
    </header>

    <form id="trackingForm">
      <label for="trackingCode">Tracking Code</label>

      <input
        id="trackingCode"
        name="trackingCode"
        type="text"
        placeholder="ဥပမာ - 15179556B6"
        autocomplete="off"
        maxlength="100"
        required
      >

      <button id="submitButton" type="submit">
        အခြေအနေ စစ်ဆေးမည်
      </button>
    </form>

    <div id="message" role="status" aria-live="polite"></div>

    <section id="result" class="result hidden" aria-live="polite">
      <h2>Repair Job အချက်အလက်</h2>

      <div class="item tracking-code-row">
        <span class="key">Tracking Code</span>
        <div class="tracking-code-actions">
          <span id="trackingCodeValue" class="tracking-code-text"></span>
          <button id="copyTrackingCodeButton" class="copy-btn" type="button">Copy ကူးမည်</button>
        </div>
      </div>

      <div class="item">
        <span class="key">Job No.</span>
        <span id="jobNo" class="value"></span>
      </div>

      <div class="item">
        <span class="key">စက်အမျိုးအစား</span>
        <span id="deviceType" class="value"></span>
      </div>

      <div class="item">
        <span class="key">အခြေအနေ</span>
        <span id="jobStatus" class="value"></span>
      </div>

      <div class="item">
        <span class="key">လက်ခံရရှိသည့်နေ့</span>
        <span id="receivedAt" class="value"></span>
      </div>
      <div class="item">
        <span class="key">ခန့်မှန်းကုန်ကျစရိတ်</span>
        <span id="estimatedCost" class="value"></span>
      </div>
      <div class="item">
        <span class="key">ခန့်မှန်းပြီးစီးမည့်ရက်</span>
        <span id="estimatedCompletionDate" class="value"></span>
      </div>
    </section>

    <p class="foot">PTY-TECH · Repair Service</p>
  </main>

  <script>
    // ==========================================
    // SUPABASE CONFIGURATION
    // ==========================================

    const SUPABASE_URL =
      "https://pcwpfuyvldbojyndlwld.supabase.co";

    // Supabase Dashboard မှ လက်ရှိ Project ၏
    // Publishable Key ကို ဒီနေရာတွင် ထည့်ပါ။
    const SUPABASE_PUBLISHABLE_KEY =
      "sb_publishable_mQnOAsZYrv2-5S9vicuotw_6inO7g8Q";

    // ==========================================
    // HTML ELEMENTS
    // ==========================================

    const form = document.getElementById("trackingForm");
    const input = document.getElementById("trackingCode");
    const button = document.getElementById("submitButton");
    const message = document.getElementById("message");
    const result = document.getElementById("result");
    const copyTrackingCodeButton = document.getElementById("copyTrackingCodeButton");
    const trackingCodeValue = document.getElementById("trackingCodeValue");

    // ==========================================
    // STATUS LABELS
    // ==========================================

    const statusLabels = {
      received: "လက်ခံရရှိ",
      diagnosing: "စစ်ဆေးနေဆဲ",
      in_progress: "ပြုပြင်နေဆဲ",
      waiting_parts: "ပစ္စည်းစောင့်ဆိုင်းနေ",
      completed: "ပြုပြင်ပြီး",
      ready_for_pickup: "လာရောက်ယူနိုင်ပါပြီ",
      delivered: "အပ်နှံပြီး",
      cancelled: "ပယ်ဖျက်ထား"
    };

    // ==========================================
    // MESSAGE HELPER
    // ==========================================

    function showMessage(text, color) {
      message.textContent = text;
      message.style.color = color;
    }

    function clearResult() {
      result.classList.add("hidden");

      document.getElementById("jobNo").textContent = "";
      document.getElementById("deviceType").textContent = "";
      document.getElementById("jobStatus").textContent = "";
      document.getElementById("receivedAt").textContent = "";
      document.getElementById("estimatedCost").textContent = "";
      document.getElementById("estimatedCompletionDate").textContent = "";
    }

    function formatMMK(value) {
      const amount = Number(value);
      if (value == null || value === "" || !Number.isFinite(amount)) return "—";
      return new Intl.NumberFormat("en-US", { maximumFractionDigits: 0 }).format(amount) + " MMK";
    }

    function formatDate(value) {
      if (!value) return "—";
      const date = new Date(value);
      if (Number.isNaN(date.getTime())) return "—";
      return date.toLocaleDateString("my-MM", { year: "numeric", month: "short", day: "numeric" });
    }

    // ==========================================
    // COPY TRACKING CODE
    // ==========================================

    copyTrackingCodeButton.addEventListener("click", async function () {
      const code = trackingCodeValue.textContent.trim();
      if (!code) return;

      try {
        if (navigator.clipboard && window.isSecureContext) {
          await navigator.clipboard.writeText(code);
        } else {
          const temp = document.createElement("textarea");
          temp.value = code;
          temp.setAttribute("readonly", "");
          temp.style.position = "fixed";
          temp.style.opacity = "0";
          document.body.appendChild(temp);
          temp.select();
          const copied = document.execCommand("copy");
          temp.remove();
          if (!copied) throw new Error("Copy failed");
        }

        copyTrackingCodeButton.textContent = "ကူးပြီးပါပြီ ✓";
        showMessage("Tracking Code ကို Copy ကူးပြီးပါပြီ။", "#14733d");
        window.setTimeout(() => {
          copyTrackingCodeButton.textContent = "Copy ကူးမည်";
        }, 1800);
      } catch (error) {
        showMessage("Copy မအောင်မြင်ပါ။ Tracking Code ကို ဖိထားပြီး ကိုယ်တိုင် Copy ကူးပါ။", "#b42318");
      }
    });

    // ==========================================
    // TRACKING FORM
    // ==========================================

    form.addEventListener("submit", async function (event) {
      event.preventDefault();

      const trackingCode = input.value.trim();

      if (!trackingCode) {
        showMessage(
          "Tracking Code ကို ထည့်ပေးပါ။",
          "#b42318"
        );
        return;
      }

      button.disabled = true;
      button.textContent = "စစ်ဆေးနေပါသည်…";

      showMessage("", "#172033");
      clearResult();

      try {
        // Supabase RPC endpoint
        const endpoint =
          SUPABASE_URL +
          "/rest/v1/rpc/track_repair_job";

        const response = await fetch(endpoint, {
          method: "POST",

          headers: {
            "Content-Type": "application/json",
            "apikey": SUPABASE_PUBLISHABLE_KEY
          },

          body: JSON.stringify({
            p_tracking_code: trackingCode
          })
        });

        // Read response text first to display useful errors
        const responseText = await response.text();

        if (!response.ok) {
          let details = responseText;

          try {
            const errorData = JSON.parse(responseText);
            details =
              errorData.message ||
              errorData.msg ||
              errorData.hint ||
              responseText;
          } catch (_) {
            // Keep original response text
          }

          if (response.status === 401) {
            throw new Error(
              "API_ERROR_401: API Key မှားနေခြင်း သို့မဟုတ် " +
              "လက်ရှိ Supabase Project နှင့် မကိုက်ညီခြင်း။ " +
              details
            );
          }

          if (response.status === 403) {
            throw new Error(
              "API_ERROR_403: Function ခွင့်ပြုချက်ကို စစ်ပါ။ " +
              details
            );
          }

          if (response.status === 404) {
            throw new Error(
              "API_ERROR_404: track_repair_job Function ကို " +
              "မတွေ့ပါ။ Function အမည်နှင့် Schema ကို စစ်ပါ။ " +
              details
            );
          }

          throw new Error(
            "API_ERROR_" + response.status + ": " + details
          );
        }

        let rows;

        try {
          rows = responseText ? JSON.parse(responseText) : [];
        } catch (_) {
          throw new Error(
            "Supabase မှ ပြန်လာသော Data ကို ဖတ်မရပါ။"
          );
        }

        // Support either an array or a single object response
        if (rows && !Array.isArray(rows)) {
          rows = [rows];
        }

        if (!Array.isArray(rows) || rows.length === 0) {
          showMessage(
            "ဒီ Tracking Code ကို မတွေ့ပါ။ Code ကို ပြန်စစ်ပြီး ထပ်ကြိုးစားပါ။",
            "#b42318"
          );
          return;
        }

        const job = rows[0];

        // Display job information safely
        trackingCodeValue.textContent = trackingCode;
        copyTrackingCodeButton.textContent = "Copy ကူးမည်";

        document.getElementById("jobNo").textContent =
          job.job_no ?? "—";

        document.getElementById("deviceType").textContent =
          job.device_type || "—";

        const statusElement = document.createElement("span");
        statusElement.className = "status";
        statusElement.textContent =
          statusLabels[job.status] ||
          job.status ||
          "အခြေအနေ မသတ်မှတ်ရသေး";

        const statusContainer =
          document.getElementById("jobStatus");

        statusContainer.replaceChildren(statusElement);

        let receivedDate = "—";

        if (job.received_at) {
          const date = new Date(job.received_at);

          if (!Number.isNaN(date.getTime())) {
            receivedDate = date.toLocaleDateString("my-MM", {
              year: "numeric",
              month: "short",
              day: "numeric"
            });
          }
        }

        document.getElementById("receivedAt").textContent =
          receivedDate;

        document.getElementById("estimatedCost").textContent =
          formatMMK(job.estimated_cost);

        document.getElementById("estimatedCompletionDate").textContent =
          formatDate(job.estimated_completion_date);

        result.classList.remove("hidden");

        showMessage(
          "အလုပ်အချက်အလက်ကို တွေ့ရှိပါသည်။",
          "#14733d"
        );

      } catch (error) {
        console.error("PTY-TECH Tracking Error:", error);

        showMessage(
          "ဆက်သွယ်မှု အမှားရှိနေပါသည်။ " +
          (error.message || "အမည်မသိအမှား ဖြစ်ပွားခဲ့သည်။"),
          "#b42318"
        );

      } finally {
        button.disabled = false;
        button.textContent = "အခြေအနေ စစ်ဆေးမည်";
      }
    });
  </script>
</body>
</html>
```
